<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<title>Relational Gospel Atlas</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="An interactive atlas of the relational gospel: Jesus as the perfect theology, the purpose of the Law, violent passages, cultural customs, the words of Jesus, and the debates.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Marcellus&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,600;1,6..72,400&display=swap">
<style>/* Layout: a night-sky atlas. Sticky header, a left "chart rail" of regions on wide screens
   (a bottom tab bar on phones), and one content plate per region. Details open in a side sheet. */
:root {
  --bg: #0e1322;
  --bg-2: #131a2e;
  --surface: #182038;
  --line: #2a3454;
  --ink: #ece5d3;
  --muted: #9ba3bd;
  --gold: #e0ae55;
  --gold-soft: rgba(224, 174, 85, 0.14);
  --wine: #d06a7c;
  --wine-soft: rgba(208, 106, 124, 0.14);
  --dawn: #79c7bd;
  --dawn-soft: rgba(121, 199, 189, 0.14);
  --shadow: 0 18px 50px rgba(2, 5, 15, 0.55);
  --display: "Marcellus", "Trajan Pro", "Palatino Linotype", Georgia, serif;
  --body: "Newsreader", "Iowan Old Style", "Palatino Linotype", Georgia, serif;
  --mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  --radius: 10px;
  --rail: 240px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #eceff4; --bg-2: #e3e7ef; --surface: #ffffff; --line: #cfd5e2;
    --ink: #192038; --muted: #59617a; --gold: #94640f; --gold-soft: rgba(148, 100, 15, 0.1);
    --wine: #a3374d; --wine-soft: rgba(163, 55, 77, 0.09); --dawn: #1f7a70; --dawn-soft: rgba(31, 122, 112, 0.1);
    --shadow: 0 16px 40px rgba(25, 32, 56, 0.16); color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #eceff4; --bg-2: #e3e7ef; --surface: #ffffff; --line: #cfd5e2;
  --ink: #192038; --muted: #59617a; --gold: #94640f; --gold-soft: rgba(148, 100, 15, 0.1);
  --wine: #a3374d; --wine-soft: rgba(163, 55, 77, 0.09); --dawn: #1f7a70; --dawn-soft: rgba(31, 122, 112, 0.1);
  --shadow: 0 16px 40px rgba(25, 32, 56, 0.16); color-scheme: light;
}

* { box-sizing: border-box; }
html { scroll-behavior: smooth; }
body {
  margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--body); font-size: 18px; line-height: 1.6;
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
a { color: var(--gold); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; border-radius: 4px; }
h1, h2, h3, h4 { font-family: var(--display); font-weight: 400; line-height: 1.15; text-wrap: balance; margin: 0; letter-spacing: 0.01em; }
p { margin: 0; }
em { font-style: italic; }
strong { font-weight: 600; }

.label { font-family: var(--mono); font-size: 11.5px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.ref { font-family: var(--mono); font-size: 13px; color: var(--gold); letter-spacing: 0.02em; }

/* ---------- header ---------- */
.top {
  position: sticky; top: env(safe-area-inset-top, 0px); z-index: 20;
  display: flex; align-items: center; gap: 12px;
  padding-block: 10px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(10px); -webkit-backdrop-filter: blur(10px);
  border-bottom: 1px solid var(--line);
}
.brand { display: flex; align-items: center; gap: 10px; text-decoration: none; color: var(--ink); min-width: 0; }
.brand-mark { width: 30px; height: 30px; flex: none; }
.brand-name { font-family: var(--display); font-size: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.brand-name span { color: var(--gold); }
.top-actions { margin-left: auto; display: flex; gap: 6px; }
.icon-btn {
  display: inline-flex; align-items: center; gap: 8px; height: 38px; padding: 0 12px;
  border: 1px solid var(--line); border-radius: 999px; background: var(--surface); cursor: pointer;
  font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; color: var(--muted);
}
.icon-btn:hover { color: var(--ink); border-color: var(--gold); }
.icon-btn svg { width: 16px; height: 16px; }
.kbd { border: 1px solid var(--line); border-radius: 4px; padding: 0 5px; font-size: 10.5px; }

/* ---------- shell ---------- */
.shell { display: grid; grid-template-columns: var(--rail) minmax(0, 1fr); min-height: calc(100vh - 60px); }
.rail {
  position: sticky; top: calc(env(safe-area-inset-top, 0px) + 59px); align-self: start;
  height: calc(100vh - 59px - env(safe-area-inset-top, 0px)); overflow-y: auto;
  border-right: 1px solid var(--line); padding: 18px 10px 30px max(10px, env(safe-area-inset-left, 0px));
}
.rail-group { margin: 14px 10px 6px; }
.rail a {
  display: flex; align-items: center; gap: 10px; padding: 7px 10px; border-radius: 8px;
  color: var(--muted); text-decoration: none; font-size: 16px; line-height: 1.3;
}
.rail a .dot { width: 7px; height: 7px; border-radius: 50%; border: 1px solid currentColor; flex: none; }
.rail a:hover { color: var(--ink); background: var(--bg-2); }
.rail a[aria-current="page"] { color: var(--ink); background: var(--gold-soft); }
.rail a[aria-current="page"] .dot { background: var(--gold); border-color: var(--gold); box-shadow: 0 0 10px var(--gold); }

main {
  min-width: 0;
  padding-block: 28px 120px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
.plate { max-width: 1060px; margin: 0 auto; display: grid; gap: 28px; animation: rise .5s ease both; }
@keyframes rise { from { transform: translateY(10px); opacity: .4; } to { transform: none; opacity: 1; } }

.view-head { display: grid; gap: 10px; max-width: 760px; }
.view-head h1 { font-size: clamp(32px, 5vw, 52px); }
.view-head .lede { font-size: 19.5px; color: var(--muted); max-width: 66ch; }

/* ---------- atlas hero ---------- */
.atlas { display: grid; grid-template-columns: minmax(0, 1.25fr) minmax(0, 1fr); gap: 28px; align-items: center; }
.atlas-stage { position: relative; aspect-ratio: 1 / 1; max-width: 100%; border-radius: 50%; }
.atlas-stage canvas { width: 100%; height: 100%; display: block; cursor: pointer; }
.atlas-tip {
  position: absolute; pointer-events: none; transform: translate(-50%, -130%);
  background: var(--surface); border: 1px solid var(--gold); border-radius: 8px; padding: 6px 10px;
  font-family: var(--mono); font-size: 12px; white-space: nowrap; box-shadow: var(--shadow);
}
.atlas-copy { display: grid; gap: 16px; }
.atlas-copy h1 { font-size: clamp(36px, 5.6vw, 64px); }
.atlas-copy h1 em { color: var(--gold); font-style: normal; }
.atlas-copy .lede { font-size: 20px; color: var(--muted); }
.verse-band {
  border-left: 2px solid var(--gold); padding: 4px 0 4px 16px; font-style: italic; font-size: 19px;
}
.verse-band .ref { display: block; font-style: normal; margin-top: 4px; }

.legend { display: flex; flex-wrap: wrap; gap: 14px; }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }

.btn {
  display: inline-flex; align-items: center; gap: 8px; padding: 10px 18px; border-radius: 999px;
  border: 1px solid var(--gold); background: var(--gold); color: var(--bg); cursor: pointer;
  font-family: var(--mono); font-size: 12.5px; letter-spacing: 0.1em; text-transform: uppercase; text-decoration: none;
}
.btn.ghost { background: transparent; color: var(--gold); }
.btn:hover { filter: brightness(1.08); }
.row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* journey path */
.path { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 12px; counter-reset: step; }
.path a {
  counter-increment: step; display: grid; gap: 4px; padding: 16px; border: 1px solid var(--line); border-radius: var(--radius);
  text-decoration: none; color: var(--ink); background: var(--bg-2); transition: border-color .2s, transform .2s;
}
.path a::before { content: "Step " counter(step); font-family: var(--mono); font-size: 11px; letter-spacing: .14em; text-transform: uppercase; color: var(--gold); }
.path a:hover { border-color: var(--gold); transform: translateY(-2px); }
.path a b { font-family: var(--display); font-weight: 400; font-size: 21px; }
.path a small { color: var(--muted); font-size: 15px; line-height: 1.45; }

/* ---------- generic cards ---------- */
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 14px; }
.card {
  position: relative; display: grid; align-content: start; gap: 8px; padding: 18px;
  border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface);
  text-align: left; cursor: pointer; transition: border-color .2s, transform .2s, box-shadow .2s;
  min-width: 0; text-decoration: none; color: var(--ink);
}
.card:hover { border-color: var(--gold); transform: translateY(-2px); box-shadow: var(--shadow); }
.card h3 { font-size: 22px; }
.card p { color: var(--muted); font-size: 16px; line-height: 1.5; }
.card .ref { font-size: 12px; }
.card .save { position: absolute; top: 12px; right: 12px; }

.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.chip {
  border: 1px solid var(--line); background: transparent; color: var(--muted); border-radius: 999px;
  padding: 6px 13px; cursor: pointer; font-family: var(--mono); font-size: 12px; letter-spacing: 0.04em;
}
.chip:hover { color: var(--ink); border-color: var(--muted); }
.chip[aria-pressed="true"] { background: var(--gold-soft); color: var(--ink); border-color: var(--gold); }

.toolbar { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; justify-content: space-between; }
.field {
  flex: 1 1 240px; display: flex; align-items: center; gap: 8px; border: 1px solid var(--line); border-radius: 999px;
  padding: 0 14px; background: var(--surface); min-width: 0;
}
.field input { flex: 1; min-width: 0; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 16px; padding: 10px 0; outline: none; }
.field svg { width: 16px; height: 16px; color: var(--muted); flex: none; }
.count { font-family: var(--mono); font-size: 12px; color: var(--muted); }

/* verdict pill */
.pill { display: inline-flex; align-items: center; gap: 6px; font-family: var(--mono); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; padding: 3px 9px; border-radius: 999px; width: max-content; }
.pill.cultural { color: var(--dawn); background: var(--dawn-soft); }
.pill.principle { color: var(--gold); background: var(--gold-soft); }
.pill.mixed { color: var(--wine); background: var(--wine-soft); }
.pill i { width: 6px; height: 6px; border-radius: 50%; background: currentColor; }

/* ---------- section blocks ---------- */
.section { display: grid; gap: 16px; }
.section > h2 { font-size: 28px; }
.prose { display: grid; gap: 14px; max-width: 68ch; }
.prose p { font-size: 18.5px; }
.split { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.panel { padding: 18px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--bg-2); display: grid; gap: 8px; align-content: start; min-width: 0; }
.panel.sep { border-color: color-mix(in srgb, var(--wine) 50%, var(--line)); background: var(--wine-soft); }
.panel.sep .label { color: var(--wine); }
.panel.uni { border-color: color-mix(in srgb, var(--dawn) 50%, var(--line)); background: var(--dawn-soft); }
.panel.uni .label { color: var(--dawn); }
.panel.gold { border-color: color-mix(in srgb, var(--gold) 50%, var(--line)); background: var(--gold-soft); }
.panel.gold .label { color: var(--gold); }

.verses { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); }
.verse { padding: 14px 16px; border-top: 1px solid var(--gold); font-style: italic; background: linear-gradient(var(--gold-soft), transparent 70%); }
.verse .ref { display: block; font-style: normal; margin-bottom: 4px; }

.qa { border-top: 1px solid var(--line); }
.qa details { border-bottom: 1px solid var(--line); }
.qa summary { cursor: pointer; list-style: none; padding: 14px 32px 14px 0; position: relative; font-size: 18px; }
.qa summary::-webkit-details-marker { display: none; }
.qa summary::after { content: "+"; position: absolute; right: 6px; top: 12px; font-family: var(--mono); color: var(--gold); font-size: 20px; transition: transform .2s; }
.qa details[open] summary::after { transform: rotate(45deg); }
.qa .ans { padding: 0 0 16px; color: var(--muted); display: grid; gap: 10px; }

.voices { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
.voice { padding: 12px 14px; border-left: 2px solid var(--line); }
.voice b { font-family: var(--display); font-weight: 400; font-size: 18px; display: block; }
.voice span { color: var(--muted); font-size: 15px; }

/* ---------- theme hero animation ---------- */
.theme-hero { display: grid; grid-template-columns: minmax(0, 1fr) 280px; gap: 24px; align-items: center; }
.theme-hero h1 { font-size: clamp(34px, 5vw, 56px); }
.theme-hero .tagline { font-size: 21px; color: var(--muted); font-style: italic; margin-top: 10px; }
.glyph { width: 100%; max-width: 280px; aspect-ratio: 1; justify-self: center; }
.glyph svg { width: 100%; height: 100%; overflow: visible; }

/* separation / union switch */
.su-switch { display: grid; gap: 14px; padding: 18px; border-radius: var(--radius); border: 1px solid var(--line); background: var(--bg-2); }
.su-toggle { display: inline-flex; border: 1px solid var(--line); border-radius: 999px; padding: 3px; width: max-content; max-width: 100%; }
.su-toggle button { border: 0; background: transparent; padding: 7px 16px; border-radius: 999px; cursor: pointer; font-family: var(--mono); font-size: 12px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); }
.su-toggle button[aria-pressed="true"].s { background: var(--wine-soft); color: var(--wine); }
.su-toggle button[aria-pressed="true"].u { background: var(--dawn-soft); color: var(--dawn); }
.su-scene { width: 100%; max-width: 640px; aspect-ratio: 16 / 7; }
.su-scene svg { width: 100%; height: 100%; }
.su-scene .fig { transition: transform 1.2s cubic-bezier(.6,.05,.25,1); }
.su-scene .gap { transition: opacity 1s; }
.su-text { font-size: 18px; min-height: 3em; }

/* ---------- contrasts (lens) ---------- */
.contrast { display: grid; gap: 12px; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.contrast h3 { font-size: 23px; }
.lensbox { position: relative; display: grid; min-height: 120px; }
.lensbox > div { grid-area: 1 / 1; padding: 16px; border-radius: 8px; transition: opacity .35s, filter .35s; }
.lensbox .ot { background: var(--wine-soft); }
.lensbox .nt { background: var(--dawn-soft); }
.lensbox q { quotes: none; font-style: italic; font-size: 18.5px; display: block; margin-top: 4px; }
.slider-row { display: grid; grid-template-columns: auto minmax(0, 1fr) auto; gap: 12px; align-items: center; }
.slider-row input[type=range] { width: 100%; accent-color: var(--gold); }
.contrast .note { color: var(--muted); font-size: 16.5px; }

/* ---------- timeline ---------- */
.timeline { position: relative; display: grid; gap: 18px; padding-left: 30px; }
.timeline::before { content: ""; position: absolute; left: 9px; top: 6px; bottom: 6px; width: 2px; background: linear-gradient(var(--wine), var(--gold) 55%, var(--dawn)); border-radius: 2px; }
.t-era { font-family: var(--mono); font-size: 11.5px; letter-spacing: .16em; text-transform: uppercase; color: var(--gold); margin: 10px 0 -6px; position: relative; }
.t-era::before { content: ""; position: absolute; left: -26px; top: 3px; width: 10px; height: 10px; border-radius: 50%; background: var(--gold); box-shadow: 0 0 12px var(--gold); }
.t-item { display: grid; gap: 10px; padding: 18px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.t-item h3 { font-size: 22px; }
.t-cols { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 10px; }
.t-cols > div { display: grid; gap: 4px; align-content: start; font-size: 16px; padding: 10px 12px; border-radius: 8px; min-width: 0; }
.t-cols .a { background: var(--wine-soft); } .t-cols .a .label { color: var(--wine); }
.t-cols .b { background: var(--gold-soft); } .t-cols .b .label { color: var(--gold); }
.t-cols .c { background: var(--dawn-soft); } .t-cols .c .label { color: var(--dawn); }

/* ---------- debate ---------- */
.flip { perspective: 1200px; min-height: 260px; cursor: pointer; border: 0; padding: 0; background: none; text-align: left; }
.flip-inner { position: relative; width: 100%; height: 100%; min-height: 260px; transition: transform .7s cubic-bezier(.4,.1,.2,1); transform-style: preserve-3d; }
.flip.on .flip-inner { transform: rotateY(180deg); }
.flip-face { position: absolute; inset: 0; backface-visibility: hidden; -webkit-backface-visibility: hidden; border-radius: var(--radius); padding: 20px; display: grid; align-content: space-between; gap: 10px; border: 1px solid var(--line); overflow: auto; }
.flip-face.front { background: var(--wine-soft); border-color: color-mix(in srgb, var(--wine) 45%, var(--line)); }
.flip-face.front h3 { font-size: 22px; }
.flip-face.back { background: var(--surface); transform: rotateY(180deg); border-color: color-mix(in srgb, var(--dawn) 45%, var(--line)); font-size: 15.5px; line-height: 1.5; }
.flip-face .label { color: var(--wine); }
.flip-face.back .label { color: var(--dawn); }

.scale { display: grid; gap: 14px; padding: 20px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.scale h3 { font-size: 24px; }
.scale ul { margin: 0; padding-left: 18px; display: grid; gap: 8px; font-size: 16px; }

/* ---------- reading compass ---------- */
.compass { display: grid; grid-template-columns: 300px minmax(0, 1fr); gap: 20px; align-items: start; }
.compass-list { display: grid; gap: 4px; position: sticky; top: 90px; }
.compass-list button { text-align: left; border: 1px solid transparent; background: transparent; border-radius: 8px; padding: 8px 10px; cursor: pointer; color: var(--muted); display: flex; gap: 10px; align-items: baseline; font-size: 16px; }
.compass-list button b { font-family: var(--mono); font-weight: 400; font-size: 11px; color: var(--gold); }
.compass-list button[aria-current="true"] { background: var(--gold-soft); color: var(--ink); border-color: var(--gold); }
.compass-list button.done { color: var(--ink); }
.compass-list button.done b::after { content: " ✓"; color: var(--dawn); }
.compass-card { display: grid; gap: 14px; padding: 22px; border: 1px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.compass-card h2 { font-size: 30px; }
.compass-card textarea { width: 100%; min-height: 110px; resize: vertical; border: 1px solid var(--line); border-radius: 8px; background: var(--bg-2); color: var(--ink); font: inherit; font-size: 16px; padding: 12px; }
.passage-field { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }

/* ---------- sheet ---------- */
.scrim { position: fixed; inset: 0; background: rgba(5, 8, 18, 0.55); z-index: 40; animation: fade .25s both; }
@keyframes fade { from { opacity: 0; } }
.sheet {
  position: fixed; z-index: 41; top: 0; right: 0; bottom: 0; width: min(640px, 100%);
  background: var(--bg); border-left: 1px solid var(--line); box-shadow: var(--shadow);
  overflow-y: auto; animation: slide .35s cubic-bezier(.3,.7,.2,1) both;
  padding: calc(env(safe-area-inset-top, 0px) + 20px) max(22px, env(safe-area-inset-right, 0px)) calc(env(safe-area-inset-bottom, 0px) + 40px) 22px;
}
@keyframes slide { from { transform: translateX(40px); opacity: 0; } }
.sheet-head { display: flex; gap: 10px; align-items: flex-start; justify-content: space-between; }
.sheet h2 { font-size: 32px; margin-top: 6px; }
.sheet-body { display: grid; gap: 16px; margin-top: 18px; }
.sheet .blk { display: grid; gap: 6px; }
.sheet .blk p { font-size: 17.5px; }
.links { display: grid; gap: 8px; }
.links div { padding: 8px 12px; border-left: 2px solid var(--gold); background: var(--gold-soft); font-size: 16px; border-radius: 0 6px 6px 0; }
.tabs { display: flex; flex-wrap: wrap; gap: 6px; }
.tab-panel { padding: 14px 16px; border-radius: 8px; background: var(--bg-2); border: 1px solid var(--line); }

.save { border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 999px; width: 34px; height: 34px; display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.save svg { width: 15px; height: 15px; }
.save[aria-pressed="true"] { color: var(--gold); border-color: var(--gold); }
.save[aria-pressed="true"] svg { fill: currentColor; }

/* ---------- search ---------- */
.search-box { position: fixed; z-index: 41; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 70px); transform: translateX(-50%); width: min(720px, calc(100% - 32px)); background: var(--bg); border: 1px solid var(--line); border-radius: 14px; box-shadow: var(--shadow); overflow: hidden; animation: fade .2s both; }
.search-box .field { border: 0; border-bottom: 1px solid var(--line); border-radius: 0; background: transparent; padding: 4px 18px; }
.search-box .field input { font-size: 18px; }
.results { max-height: min(60vh, 520px); overflow-y: auto; }

<script>window.RG = window.RG || {};

RG.themes = [
  {
    id: "perfect-theology",
    title: "Jesus Is Perfect Theology",
    tagline: "If you want to know what God is like, look at Jesus. There is no other God hiding behind him.",
    keyVerses: [
      { ref: "Hebrews 1:3", text: "His Son is the radiance of his glory, the very image of his substance, and upholding all things by the word of his power." },
      { ref: "John 1:18", text: "No one has seen God at any time. The one and only Son, who is in the bosom of the Father, he has declared him." },
      { ref: "John 14:9", text: "He who has seen me has seen the Father. How do you say, ‘Show us the Father?’" },
      { ref: "Colossians 2:9", text: "For in him all the fullness of the Deity dwells bodily." }
    ],
    body: [
      "Everything in the relational gospel starts here. Jesus is not one picture of God among many, or a softer side of a sterner God. He is the <em>exact representation</em> of who God is. Hebrews 1:3 uses the Greek word <em>charaktēr</em>, the stamp an engraving leaves in wax. What you see in Jesus is the true impression of the Father.",
      "John says no one has ever seen God, but the Son who lives in the Father’s embrace has made him known (John 1:18). The word for ‘declared’ is <em>exēgēsato</em>, from which we get ‘exegesis’. Jesus is the Father’s own explanation of himself. When Philip asked to be shown the Father, Jesus answered that he had been looking at him all along (John 14:9).",
      "Paul says the same thing in other words. Christ is ‘the image of the invisible God’ (Colossians 1:15), and in him ‘all the fullness of the Deity dwells bodily’ (Colossians 2:9). God does not hold back some darker part of himself that Jesus failed to show us. As Archbishop Michael Ramsey put it, God is Christlike, and in him there is no un-Christlikeness at all.",
      "This becomes a lens for reading the whole Bible. Teachers like Brad Jersak, Greg Boyd and Brian Zahnd call it a <em>Christ-centred</em> or <em>cruciform</em> way of reading. If a passage seems to show God acting in a way Jesus never would, we hold it up to Jesus rather than holding Jesus up to it. Jesus himself read the Scriptures this way, saying that they testify about him (John 5:39).",
      "The phrase ‘Jesus is perfect theology’ was popularised in recent years by the pastor Bill Johnson, and many in this stream have taken it up. The idea is much older. The early church fought hard to say that the Son is of one being (<em>homoousios</em>) with the Father, precisely so that we could trust that meeting Jesus really is meeting God.",
      "So when we see Jesus touch lepers, eat with sinners, forgive his killers and welcome children, we are not seeing an exception to God’s character. We are seeing God’s character. The Father is not reluctant where Jesus is eager. They are one."
    ],
    separation: "God is known first through his attributes, his law and his wrath, and Jesus is the merciful solution who shields us from the Father’s anger. Jesus shows us one side of God, while God’s holiness and justice may operate in ways quite unlike Jesus.",
    union: "Jesus is the full and final revelation of the Father’s heart. Every idea of God, including our readings of hard Old Testament texts, is measured against the face of Jesus, because the Father is exactly like the Son.",
    voices: [
      { name: "Michael Ramsey", note: "Archbishop of Canterbury (1961–74) who wrote that God is Christlike and in him is no un-Christlikeness at all." },
      { name: "Brad Jersak", note: "Author of <em>A More Christlike God</em> (2015), arguing that our image of God must be reshaped by the self-giving love revealed in Christ." },
      { name: "Greg Boyd", note: "Author of <em>The Crucifixion of the Warrior God</em> (2017), a large study proposing a cross-centred reading of violent Old Testament portraits of God." },
      { name: "Brian Zahnd", note: "Pastor and author who often says that God is like Jesus and has always been like Jesus, and who urges reading the Bible through Christ." },
      { name: "Athanasius", note: "Fourth-century bishop who defended the Son’s full divinity, insisting that in Christ we meet God himself, not a lesser go-between." }
    ],
    objections: [
      { q: "Doesn’t this create a ‘canon within the canon’ and let us discard parts of Scripture we dislike?", a: "It is a fair worry. The relational reading does not delete texts. It asks how they point to Christ, as the apostles did when they reread the Old Testament in light of him. The New Testament itself says God spoke ‘in various ways’ before, but has now spoken ‘by his Son’ (Hebrews 1:1–2). Giving the Son the final word is following Scripture’s own direction." },
      { q: "Jesus also spoke about judgment, hell and wrath. Isn’t ‘Christlike’ a selective picture?", a: "Yes, Jesus gave strong warnings, and an honest Christlike theology must include them. The relational view holds that his warnings come from the same love that wept over Jerusalem. They describe the destructive results of refusing love, and they do not reveal a God who stops loving." },
      { q: "Isn’t the Father’s role different from the Son’s? Jesus prays, submits and is sent.", a: "Traditional theology rightly distinguishes the persons of the Trinity. But the persons share one nature, one will and one love. The Son’s obedience shows the Father’s heart. It does not show a gap between them." }
    ],
    related: ["nature-of-god", "triune-dance", "cross", "incarnation"]
  },
  {
    id: "nature-of-god",
    title: "The Nature of God",
    tagline: "The prophets saw God through a glass dimly. In Jesus the light comes fully on, and God is love.",
    keyVerses: [
      { ref: "Hebrews 1:1–2", text: "God, having in the past spoken to the fathers through the prophets at many times and in various ways, has at the end of these days spoken to us by his Son." },
      { ref: "1 John 4:8", text: "He who doesn’t love doesn’t know God, for God is love." },
      { ref: "Philippians 2:6–7", text: "Who, existing in the form of God, didn’t consider equality with God a thing to be grasped, but emptied himself, taking the form of a servant." }
    ],
    body: [
      "The Old Testament is a true and holy story of God revealing himself. Relational teachers also read it as a <em>progressive</em> revelation. Israel came to know God over centuries, often through the lens of their own culture, fears and wars. The picture grew clearer over time, but it was still partial until Jesus came.",
      "Hebrews 1:1–2 sets up the contrast. God spoke before ‘at many times and in various ways’, but now he has spoken ‘by his Son’. Jesus himself made corrections. He quoted the law and then said, ‘But I tell you’ (Matthew 5). When his disciples wanted to call down fire like Elijah, Jesus turned and rebuked them (Luke 9:54–55).",
      "Some passages show the people of God feeling sure that God commanded violence or sent disaster. Writers like Greg Boyd suggest that God, like a patient parent, allowed his people to see him partly through their own expectations, and stooped to meet them where they were. Others, such as Peter Enns, speak of the Bible as an honest record of a people’s growing understanding. These are interpretations, and they are debated, but they all say Jesus is the clearest window.",
      "John’s summary is very simple: ‘God is love’ (1 John 4:8). Love is not one quality God has among others, which he might switch off. It is what he is. His holiness is the holiness of love. His justice is love setting things right. Even his ‘wrath’ is love’s fierce opposition to whatever destroys his children.",
      "The clearest picture of this is <em>kenosis</em>, the ‘self-emptying’ of Philippians 2:7. The Son did not grasp at status. He poured himself out, took the form of a servant and went all the way to the cross. Relational teachers see this not as God acting against his nature, but as God showing us his nature. The New Testament scholar Michael Gorman argues that this self-giving, cross-shaped pattern reveals the very character of God.",
      "This changes how we picture God at the centre of everything. He is not a distant monarch who must be calmed down. He is a self-giving Father, Son and Spirit whose power looks like a towel and a basin, a meal shared with outcasts, and arms stretched wide on a cross."
    ],
    separation: "God is holy, just and wrathful as well as loving, and these attributes must be balanced. The Old Testament’s violent portraits show one true side of his character, which the cross satisfies.",
    union: "God is love all the way through, and Jesus is the full picture. Old Testament portraits are honoured as part of a journey toward Christ, and the self-emptying servant on the cross shows what divine power really is.",
    voices: [
      { name: "Irenaeus of Lyons", note: "Second-century bishop who described God gradually training and accustoming humanity, like a parent with growing children." },
      { name: "Greg Boyd", note: "Proposes that God sometimes ‘accommodated’ himself to his people’s fallen views, allowing them to picture him in ways the cross later corrects." },
      { name: "Peter Enns", note: "Old Testament scholar who reads the Bible as an honest, human record of Israel’s developing understanding of God." },
      { name: "Michael Gorman", note: "New Testament scholar whose <em>Inhabiting the Cruciform God</em> (2009) argues that kenosis reveals the very character of God." }
    ],
    objections: [
      { q: "Doesn’t this pit the Old Testament against the New, like the ancient heretic Marcion?", a: "No. Marcion rejected the Old Testament and taught that its God was a different, lesser god. The relational view affirms one God throughout and keeps the whole Bible. It reads the earlier parts as genuine but incomplete revelation, completed in Christ." },
      { q: "If Israel misunderstood God at times, how can we trust any of Scripture?", a: "We trust Scripture the way Jesus and the apostles did, as inspired testimony that leads to him. Reading the Bible honestly, with its growth and tensions, does not weaken trust. It places trust where it belongs, in the living Word to whom the written words point." },
      { q: "The New Testament also speaks of God’s wrath and judgment (Romans 1, Revelation). Isn’t love being overemphasised?", a: "Wrath is truly in the New Testament. The relational view does not deny it but asks what kind of wrath it is. Romans 1 describes God ‘giving people over’ to the results of their choices. Wrath is love’s resistance to evil and its consequences, not a second, opposite nature in God." }
    ],
    related: ["perfect-theology", "cross", "law-purpose", "sin"]
  },
  {
    id: "sin",
    title: "What Sin Is",
    tagline: "Sin is missing the mark of who we really are. It is a sickness to be healed, not only a debt to be paid.",
    keyVerses: [
      { ref: "Romans 3:23", text: "For all have sinned, and fall short of the glory of God." },
      { ref: "Genesis 3:10", text: "I heard your voice in the garden, and I was afraid, because I was naked; and I hid myself." },
      { ref: "Colossians 1:21", text: "You, being in past times alienated and enemies in your mind in your evil deeds." },
      { ref: "Mark 2:17", text: "Those who are healthy have no need for a physician, but those who are sick." }
    ],
    body: [
      "The usual New Testament word for sin is <em>hamartia</em>. In older Greek its verb could describe a spear or arrow that misses its target. Many teachers draw on that picture: sin is missing the mark of the life we were made for. Paul says we ‘fall short of the glory of God’ (Romans 3:23). We fall short of being the image-bearers we really are.",
      "A word of care: a word’s root does not fix its meaning in every sentence. By Paul’s day <em>hamartia</em> meant wrongdoing in a broad sense. The ‘missing the mark’ image is a helpful illustration, not a secret key. Still, the Hebrew word <em>chata</em> is also used of slingers who ‘would not miss’ (Judges 20:16), so the image has real roots in the language of Scripture.",
      "The Bible uses many pictures for sin, not only legal ones. Sin is a sickness that needs a physician (Mark 2:17). It is slavery that needs freedom (John 8:34). It is blindness that needs sight (John 9). It is death that needs life (Ephesians 2:1). Legal language matters too, but the relational gospel says that if we only think of sin as a debt in God’s accounts, we miss most of the story.",
      "Look at what happened in Eden. After eating the fruit, Adam did not say, ‘I have broken a rule.’ He said, ‘I was afraid… and I hid myself’ (Genesis 3:10). God came walking in the garden asking, ‘Where are you?’ The first effect of sin was not that God moved away from humanity, but that humanity hid from God in fear and shame.",
      "This is key for relational teachers. Sin changed <em>us</em>. It bent our minds, filled us with fear, and made us see God as an enemy. Paul says we were ‘enemies <em>in your mind</em>’ (Colossians 1:21). What sin did not change is God. His love did not cool. His purpose for us did not fail. He came looking for us.",
      "So the cure for sin is not first of all to change God’s attitude toward us, but to heal our sickness, free us from bondage, open our blind eyes and raise us from death. That is exactly what Jesus came to do."
    ],
    separation: "Sin is primarily a legal offence against an infinitely holy God, creating an infinite debt and a guilt that separates us from him. God cannot look on sin, so he must turn away until the penalty is paid.",
    union: "Sin is a deep sickness and bondage that distorts our minds and makes us hide from God in fear. It wounds us and our relationships, but it never changed God’s love, who came looking for us in the garden and in Christ.",
    voices: [
      { name: "Athanasius", note: "In <em>On the Incarnation</em> he described sin as humanity sliding back toward corruption and non-being, needing restoration by the Word." },
      { name: "Augustine of Hippo", note: "Though known for strong views on original sin, he often spoke of Christ as the physician (<em>Christus medicus</em>) healing a sick humanity." },
      { name: "C. Baxter Kruger", note: "Emphasises that the fall produced a darkened, fearful human mind that projects its own shame onto God." },
      { name: "Eastern Orthodox tradition", note: "Generally describes sin and salvation in terms of illness and healing, death and life, more than courtroom imagery." }
    ],
    objections: [
      { q: "Doesn’t Scripture use plenty of legal language: guilt, condemnation, judgment?", a: "It does, and the relational view should not erase it. The question is which picture is in charge. Relational teachers hold that legal images serve the larger story of a Father restoring his children. Courtroom language is one true angle, not the whole frame." },
      { q: "Doesn’t Habakkuk 1:13 say God’s eyes are too pure to look on evil?", a: "That verse is part of Habakkuk’s complaint, and in the same verse he asks why God <em>does</em> look on the wicked. In Jesus, God touches lepers, eats with sinners and is ‘made to be sin’ on our behalf. God draws near to sinners. He does not turn his face away." },
      { q: "If sin is only a sickness, aren’t people let off the hook for their choices?", a: "No. Sickness language does not deny responsibility. It describes how deep the problem goes. We truly choose wrong, and we are also captives in need of rescue. Both are true, and both call for honest repentance." }
    ],
    related: ["separation-union", "undoing-adam", "cross", "law-purpose"]
  },
  {
    id: "separation-union",
    title: "Separation or Union?",
    tagline: "Two gospels, one question: does the story start with distance, or with a love that refuses to let go?",
    keyVerses: [
      { ref: "2 Corinthians 5:19", text: "God was in Christ reconciling the world to himself, not reckoning to them their trespasses." },
      { ref: "John 14:20", text: "In that day you will know that I am in my Father, and you in me, and I in you." },
      { ref: "Isaiah 59:2", text: "But your iniquities have separated you and your God, and your sins have hidden his face from you." }
    ],
    body: [
      "Many of us learned a gospel of <em>separation</em>. It goes like this: God is holy, you are sinful, so there is a great gap between you. God is angry about your sin. Jesus died to pay the penalty. If you believe, the gap is closed and you can go to heaven. If you do not, the separation becomes permanent.",
      "The relational gospel tells the story as a gospel of <em>union</em>. The Father, Son and Spirit created us out of love to share their life. When we fell, God did not step back. The Son came into our fallen humanity, joined himself to us, and carried us through death into resurrection. In Christ, humanity has already been brought home. The good news is an announcement of what God has done.",
      "Notice the difference in where each story begins. Separation begins with sin and the problem. Union begins with the Trinity and God’s purpose, before the world was made (Ephesians 1:4). Sin is real, but it is a plot twist inside a love story, not the opening line.",
      "Notice, too, who moves. In the separation story we must cross the gap by doing something, even if that something is only believing. In the union story God has already crossed the gap from his side, entirely. Paul says ‘God was in Christ reconciling the world to himself’ (2 Corinthians 5:19). The ministry of the church is to announce this and to invite people: be reconciled, wake up to it, live in it.",
      "What about verses like Isaiah 59:2, where sin ‘separates’ us from God? Relational teachers take them seriously. They say the separation is real on our side, in our minds, our fear and our experience. But God never stopped pursuing. In Isaiah 59 itself, God sees there is no one to help and comes with his own arm to save (59:16). The cross is God refusing to stay separated.",
      "The result is a very different way of living. Separation produces anxious performance: am I in or out, have I done enough? Union produces rest and gratitude: I belong, I am loved, now let me learn to live as who I truly am."
    ],
    separation: "Humanity begins outside God’s favour, cut off by sin, and must respond correctly to be brought into relationship. The gospel offers a way to cross the gap.",
    union: "Humanity was created in Christ and, through his incarnation, death and resurrection, has been joined to God. The gospel announces that the gap has been closed from God’s side and calls us to awaken to it and live in it.",
    voices: [
      { name: "J. B. Torrance", note: "Scottish theologian who contrasted a ‘covenant’ of grace with a ‘contract’ mindset that makes God’s love conditional (<em>Worship, Community and the Triune God of Grace</em>, 1996)." },
      { name: "T. F. Torrance", note: "His brother, who stressed that in Christ God has united himself to humanity from within, in <em>The Mediation of Christ</em>." },
      { name: "C. Baxter Kruger", note: "Popularised the union framing in <em>The Great Dance</em> and <em>Jesus and the Undoing of Adam</em>." },
      { name: "Karl Barth", note: "Swiss theologian who taught that in Christ God elected himself for humanity and humanity for himself." }
    ],
    objections: [
      { q: "Doesn’t the Bible clearly teach a ‘before and after’: once far off, now brought near (Ephesians 2:13)?", a: "Yes, and the union view agrees there is a real before and after in our experience. The question is whether that change is created by our decision or revealed to us by the Spirit. Relational teachers say Ephesians 2 itself credits God alone: ‘made alive together with Christ’ (2:5)." },
      { q: "If everyone is already united to Christ, why evangelise?", a: "Because people are living in the dark about who they are. A union gospel gives a strong reason to share good news: we tell people what is true about them and invite them to see it, trust it and enjoy it. The stakes are very real in this life and the next." },
      { q: "Isn’t this just universalism under another name?", a: "Not necessarily. Some union teachers are hopeful universalists, but others, such as T. F. Torrance, rejected universalism while still insisting Christ united himself to all humanity. The union view is first about what God has done, and people within it disagree about the final outcome." }
    ],
    related: ["inclusion", "incarnation", "undoing-adam", "triune-dance"]
  },
  {
    id: "incarnation",
    title: "The Incarnation",
    tagline: "God did not save us from a distance. He became what we are so that we might share what he is.",
    keyVerses: [
      { ref: "John 1:14", text: "The Word became flesh, and lived among us. We saw his glory, such glory as of the only born of the Father, full of grace and truth." },
      { ref: "Hebrews 2:14", text: "Since then the children have shared in flesh and blood, he also himself in the same way partook of the same." },
      { ref: "Romans 8:3", text: "God did, sending his own Son in the likeness of sinful flesh and for sin, he condemned sin in the flesh." }
    ],
    body: [
      "For many Christians the incarnation is the necessary first step so that Jesus could die. For the early church, and for the relational gospel, it is much more. The incarnation is itself saving. When the eternal Son took on our humanity, he joined God and humanity together in his own person, never to be undone.",
      "Irenaeus said that Christ, out of his great love, ‘became what we are, that he might bring us to be even what he is himself’. Athanasius, two centuries later, said that the Word became human so that we might be made divine. He did not mean we become God by nature, but that we come to share God’s life by grace, the teaching called <em>theosis</em> (compare 2 Peter 1:4).",
      "Gregory of Nazianzus gave the church a famous rule: ‘that which he has not assumed he has not healed’. He wrote it against Apollinarius, who said Jesus did not have a human mind. Gregory replied that if any part of our humanity was left out, that part was left unhealed. So Jesus took on the whole of what we are: body, mind, will and emotions.",
      "Some theologians took this one step further. Edward Irving in the nineteenth century, and later Karl Barth and T. F. Torrance, taught that the Son assumed our <em>fallen</em> human nature, the very flesh that is bent by sin, and yet never sinned in it. Paul’s phrase ‘in the likeness of sinful flesh’ (Romans 8:3) is a key text. On this view, Jesus healed our humanity from the inside, bending it back to the Father through a lifetime of faithful love.",
      "This is debated. Many traditional theologians hold that Christ took an <em>unfallen</em> human nature, worrying that ‘fallen’ implies sinfulness. Irving was removed from his ministry in 1833, partly over the issue. Those who hold the ‘fallen nature’ view answer that Jesus took our condition without our guilt, so that he could meet us exactly where we are.",
      "Either way, the incarnation means God is not ashamed of us. He wears our skin. He knows our weakness from within (Hebrews 4:15). And in the risen, ascended Jesus, a human being now sits at the heart of the Trinity."
    ],
    separation: "The incarnation was necessary so that a sinless man could die as a substitute, paying the penalty humans owed. Its main purpose was to make the cross possible.",

    body: [
      "The church has never had a single official theory of how the cross saves. Instead it has held several pictures, called atonement models. Each sees something true. The relational gospel draws on all of them, but reads them through the face of Jesus.",
      "The <strong>ransom</strong> picture (Mark 10:45), developed by early writers like Origen and Gregory of Nyssa, sees Christ paying a ransom to free captives. <strong>Christus Victor</strong>, a name made famous by Gustaf Aulén in 1931, sees the cross as Christ’s victory over sin, death and the devil (Colossians 2:15). <strong>Recapitulation</strong>, from Irenaeus, sees Jesus living the human story again, faithfully, and so undoing Adam’s failure.",
      "The <strong>moral influence</strong> view, associated with Peter Abelard in the twelfth century, stresses that the cross reveals God’s love and melts our hearts. Anselm’s <strong>satisfaction</strong> view (c. 1098) spoke of restoring God’s offended honour. The Reformers developed <strong>penal substitution</strong>: Christ bore the punishment for sin that we deserved, satisfying God’s justice. This last view is central in much evangelical teaching, and its defenders argue it has deep roots in Scripture, such as Isaiah 53.",
      "Relational teachers usually object to one version of penal substitution: the idea that the Father needed to pour out violent wrath on his Son before he could forgive. They ask: if God requires payment before forgiving, has he really forgiven? Jesus forgave sins freely long before the cross (Mark 2:5). On the cross he prayed, ‘Father, forgive them’ (Luke 23:34; this verse is missing from some early manuscripts, though many scholars think it is authentic). Forgiveness was already in God’s heart.",
      "Instead they see the cross as the place where God absorbs our violence. The religious and political powers of the world condemned Jesus. Humanity projected its anger, fear and blame onto him, and he carried it without retaliating. Thinkers influenced by René Girard see the cross as exposing the whole scapegoat mechanism that human societies run on. God does not need violence; we do, and at the cross God lets it fall on himself and answers with forgiveness.",
      "Yes, Christ died ‘for us’ and ‘in our place’. The relational view keeps substitution, but reframes it. Christ stood in for us not to change the Father’s mind, but to enter our death, take our sin into himself and destroy it (2 Corinthians 5:21). He bore the consequence of sin, the alienation and death it brings, and in doing so carried our humanity through to resurrection."
    ],
    separation: "God’s justice requires that sin be punished. On the cross the Father poured out his wrath on his Son as our substitute, so that God can now forgive those who believe without compromising his holiness.",
    union: "On the cross the Son, one with the Father, entered our sin and death and absorbed humanity’s violence and rejection, answering it with forgiveness. The cross reveals God’s self-giving love and defeats sin and death from within; it does not change God’s mind about us.",
    voices: [
      { name: "Irenaeus of Lyons", note: "Developed recapitulation: Christ sums up and heals the whole human story, undoing Adam’s disobedience by his obedience." },
      { name: "Gustaf Aulén", note: "Swedish bishop whose <em>Christus Victor</em> (1931) argued that the victory theme was the classic view of the early church." },
      { name: "René Girard", note: "French thinker whose mimetic theory saw the cross as exposing and undoing humanity’s scapegoating violence." },
      { name: "John Stott", note: "Evangelical leader whose <em>The Cross of Christ</em> (1986) offers a careful defence of penal substitution, worth reading for the other side." },
      { name: "Brad Jersak", note: "Edited <em>Stricken by God?</em> (2007, with Michael Hardin), a collection of essays on nonviolent readings of the atonement." }

    objections: [
      { q: "Isaiah 53 says ‘it pleased the LORD to bruise him’. Isn’t that the Father punishing the Son?", a: "It is a serious text. Relational readers note that the chapter also says ‘we considered him plagued, struck by God’ (53:4), describing how the onlookers saw it. Many see the passage as God working through human violence, bearing it rather than requiring it. Penal substitution advocates read it more directly, and this remains a real debate." },
      { q: "Hebrews 9:22 says without shedding of blood there is no forgiveness.", a: "Within the sacrificial system that was true. Hebrews goes on to say those sacrifices could never take away sin (10:4), and that Christ’s self-offering ends the system. Relational teachers see Christ’s blood as his life poured out to cleanse and heal us, not as a payment God needed in order to love." },
      { q: "Doesn’t rejecting penal substitution weaken God’s justice and holiness?", a: "The relational view redefines justice rather than discarding it. Biblical justice is about setting things right. At the cross sin is truly judged and condemned (Romans 8:3) and its power broken. God’s holiness is shown in a love that takes evil seriously enough to enter it and defeat it." }

      "An honest note: many popular books say <em>perichoresis</em> means ‘dancing around’. Etymologically it does not. It comes from <em>perichōreō</em>, ‘to go around, to make room, to interpenetrate’. ‘Dance’ is from a similar-looking but different word, <em>perichoreuō</em>. Baxter Kruger, Richard Rohr and others use dance as an <em>image</em>, and it is a lovely one, but it is a picture, not the word’s literal meaning.",
      "The image has older friends. C. S. Lewis, in <em>Mere Christianity</em>, described the life of the Trinity as almost a kind of dance. Kruger’s <em>The Great Dance</em> (2000) and Rohr’s <em>The Divine Dance</em> (2016, with Mike Morrell) popularised the idea of creation being swept into the Trinity’s joy.",

      "This view grows from the theology of Karl Barth and T. F. and J. B. Torrance. Barth taught that Jesus Christ is both the electing God and the elected human; in him God chose humanity. The Torrances stressed the ‘vicarious humanity’ of Christ, his life, faith, worship and obedience offered in our place. Grace Communion International, formerly the Worldwide Church of God, adopted this ‘Trinitarian theology’ in the 1990s and 2000s, and Baxter Kruger has taught it widely.",
      "What then is faith? Not the switch that makes salvation real, but our <em>awakening</em> to what is already true. Torrance spoke of faith as our response to the faithfulness of Christ, which comes first. Think of someone who has been left a fortune but does not know it. Telling them does not create the gift; it lets them live in it. Unbelief, on this view, is still deeply serious, because it means living blind to who you are and to the love that holds you.",
      "This needs to be clearly distinguished from the ‘Gospel of Inclusion’ taught by Carlton Pearson. Pearson was a well-known Pentecostal bishop in Tulsa who, around 2002, began teaching that all people are already saved whether or not they know Christ. In 2004 the Joint College of African-American Pentecostal Bishops declared his teaching heretical, and he later moved into wider interfaith circles and a Unitarian Universalist congregation. His book <em>The Gospel of Inclusion</em> appeared in 2006.",
      "The differences matter. Trinitarian inclusion is fiercely Christ-centred: humanity is included because of who Jesus is and what he did, not because all religions are equally true. It affirms the Trinity, the incarnation and the atonement. Pearson’s later views became much more pluralist. Many Trinitarian theologians, including T. F. Torrance himself, also refused to teach that all will finally be saved, even while saying all are included in Christ. The debate about final outcomes is open within this camp.",

    id: "sabbath-death-penalty",

    ot: { ref: "Exodus 31:15", text: "Whosoever doeth any work in the sabbath day, he shall surely be put to death. (KJV)" },
    nt: { ref: "Mark 2:27", text: "The sabbath was made for man, and not man for the sabbath. (KJV)" },
    note: `In Exodus the Sabbath is the sign of the covenant, and breaking it is a capital offence (see Numbers 15:32-36). Jesus heals on the Sabbath, defends his hungry disciples, and calls himself "Lord also of the sabbath". Traditional readers say Jesus did not abolish the Sabbath but restored its true purpose, and many apply its principle to the Lord's Day. Christ-centred readers add that the death penalty shows how far the law could be from the Sabbath's purpose of rest and freedom (Deuteronomy 5:15). In Jesus, the Sabbath becomes a person: "Come unto me... and I will give you rest" (Matthew 11:28).`
  },
  {
    id: "sacrifice-or-mercy",
    topic: "Sacrifice",
    ot: { ref: "Leviticus 17:11", text: "For the life of the flesh is in the blood... it is the blood that maketh an atonement for the soul. (KJV)" },
    nt: { ref: "Matthew 9:13", text: "Go ye and learn what that meaneth, I will have mercy, and not sacrifice. (KJV)" },
    note: `Leviticus sets out a detailed sacrificial system, yet Jesus is quoting the Old Testament itself (Hosea 6:6), and many prophets and psalms say God desires mercy and a broken heart more than offerings. Traditional readers see no contradiction: Hosea means "mercy more than sacrifice", and the sacrifices pointed forward to Christ's once-for-all sacrifice (Hebrews 10:10). Relational readers read the prophets as revealing that God never needed blood to love us, and the cross as God giving himself rather than receiving a payment. Both agree that in Christ the sacrificial system ends (Hebrews 10:18). How exactly the cross 'works' is one of the most debated questions in theology.`
  },
  {
    id: "fire-from-heaven",
    topic: "Fire from heaven",
    ot: { ref: "2 Kings 1:10", text: "If I be a man of God, then let fire come down from heaven, and consume thee and thy fifty. (KJV)" },
    nt: { ref: "Luke 9:55", text: "But he turned, and rebuked them. (KJV)" },
    note: `James and John explicitly appeal to Elijah's example, and Jesus rebukes them. The KJV adds, "Ye know not what manner of spirit ye are of", though this is missing from the earliest manuscripts. Traditional readers say Elijah acted rightly in his time as God's prophet, but the disciples' situation and spirit were different. Christ-centred readers see Jesus refusing to let an Old Testament precedent define God's response to rejection. The gospel later reaches that very region of Samaria with joy (Acts 8).`
  },
  {
    id: "holy-war",
    topic: "Holy war",
    ot: { ref: "Deuteronomy 20:16", text: "Thou shalt save alive nothing that breatheth. (KJV)" },
    nt: { ref: "John 18:36", text: "My kingdom is not of this world: if my kingdom were of this world, then would my servants fight. (KJV)" },
    note: `The conquest commands envisage Israel fighting for God, while Jesus says his kingdom does not advance by fighting at all. Traditional readers explain the conquest as a unique act of judgement tied to Israel's land and time, never meant as a pattern for the church. Some evangelical scholars also argue its language is hyperbolic war rhetoric. Christ-centred readers see Jesus redefining the enemy: "we wrestle not against flesh and blood" (Ephesians 6:12). Either way, the New Testament gives Christians no warrant for holy war.`
  },
  {
    id: "where-to-worship",
    topic: "Where God is worshipped",
    ot: { ref: "Deuteronomy 12:5", text: "Unto the place which the LORD your God shall choose out of all your tribes to put his name there... thither thou shalt come. (KJV)" },
    nt: { ref: "John 4:21, 23", text: "The hour cometh, when ye shall neither in this mountain, nor yet at Jerusalem, worship the Father... the true worshippers shall worship the Father in spirit and in truth. (KJV)" },
    note: `Israel's worship was centred on one chosen place, which became the temple in Jerusalem. Jesus tells a Samaritan woman that place will no longer matter. Traditional readers see the temple as a temporary shadow pointing to Christ, the true temple (John 2:19-21). Even Solomon admitted, "the heaven and heaven of heavens cannot contain thee; how much less this house" (1 Kings 8:27). In Christ, and by his Spirit in his people (1 Corinthians 3:16), God dwells wherever people worship in spirit and truth.`
  },
  {
    id: "vengeance-or-forgiveness",
    topic: "Vengeance",
    ot: { ref: "Nahum 1:2", text: "God is jealous, and the LORD revengeth; the LORD revengeth, and is furious. (KJV)" },
    nt: { ref: "Luke 23:34", text: "Father, forgive them; for they know not what they do. (KJV)" },
    note: `Nahum celebrates God's vengeance on Nineveh, the capital of the brutal Assyrian empire. Jesus, being crucified by an empire, prays for his killers' forgiveness. This prayer is absent from some early manuscripts, though most scholars consider it an authentic early tradition. Traditional readers say both are true: God avenges injustice, and the cross is where vengeance and forgiveness meet as Christ bears judgement. Christ-centred readers notice that Jonah, set in the same city, already shows God sparing Nineveh, and see the cross as God's final answer to violence.`
  },
  {
    id: "cursed-on-a-tree",
    topic: "The curse of the tree",
    ot: { ref: "Deuteronomy 21:23", text: "He that is hanged is accursed of God. (KJV)" },
    nt: { ref: "Galatians 3:13", text: "Christ hath redeemed us from the curse of the law, being made a curse for us: for it is written, Cursed is every one that hangeth on a tree. (KJV)" },
    note: `For a first-century Jew, a crucified Messiah seemed impossible, because the law said one hanged on a tree was cursed. Paul does not deny the text; he turns it inside out: Christ entered the place of the curse to redeem those under it. Traditional readers see this as penal substitution, Christ bearing the curse God's law pronounced. Relational readers see God himself entering the deepest place of human rejection and shame, so that no one is beyond his reach. Either way, the one the law called cursed turns out to be the source of blessing for the nations (Galatians 3:14).`
  },
  {
    id: "man-of-war-prince-of-peace",
    topic: "Warrior or peacemaker",
    ot: { ref: "Exodus 15:3", text: "The LORD is a man of war: the LORD is his name. (KJV)" },
    nt: { ref: "Ephesians 2:14, 17", text: "For he is our peace... and came and preached peace to you which were afar off, and to them that were nigh. (KJV)" },
    note: `The Song of Moses praises God as a warrior who drowned Pharaoh's army. Yet the title "Prince of Peace" is itself from the Old Testament (Isaiah 9:6), and Isaiah also foresees swords beaten into ploughshares (Isaiah 2:4), so the tension runs inside the Old Testament too. Traditional readers say God is both: a warrior against evil and the giver of peace, and that Christ still wages war against sin and death. Christ-centred readers see the warrior image transformed: Jesus fights by dying, and "made peace through the blood of his cross" (Colossians 1:20). He is still a victor, but his victory is reconciliation.`
  },
  {
    id: "israel-or-all-nations",
    topic: "Chosen people or all nations",
    ot: { ref: "Deuteronomy 7:6", text: "The LORD thy God hath chosen thee to be a special people unto himself, above all people that are upon the face of the earth. (KJV)" },
    nt: { ref: "Matthew 28:19", text: "Go ye therefore, and teach all nations. (KJV)" },
    note: `The Old Testament speaks of Israel as God's special, chosen people, which can sound as if God loved one nation and not the others. Yet from the start, God chose Abraham so that "in thee shall all families of the earth be blessed" (Genesis 12:3), and the prophets foresee the nations streaming to God (Isaiah 2:2-3; 49:6). Traditional readers see election as God's plan to save the world through Israel, culminating in Christ. Relational readers stress that Israel was chosen not instead of the nations but for them. In Christ the purpose of election is revealed: one family for every nation.`
  },
  {
    id: "oaths",
    topic: "Oaths and vows",
    ot: { ref: "Numbers 30:2", text: "If a man vow a vow unto the LORD, or swear an oath to bind his soul with a bond; he shall not break his word. (KJV)" },
    nt: { ref: "Matthew 5:34, 37", text: "Swear not at all... But let your communication be, Yea, yea; Nay, nay. (KJV)" },
    note: `The law regulated oaths and required that vows be kept, while Jesus tells his followers not to swear at all (see also James 5:12). Traditional readers have often said Jesus forbids casual or evasive oaths, not solemn ones in court, noting that Paul calls God as witness (2 Corinthians 1:23); Quakers and Anabaptists, by contrast, have taken Jesus' words literally. The law aimed at honesty by binding words with oaths; Jesus aims at hearts so honest that oaths become unnecessary. This fits the pattern of Matthew 5, where Jesus does not loosen the law but goes beneath it. In him, every word becomes as trustworthy as an oath.`
  }
];

;

window.RG.lawCategories = [
  { id: "sacrifice", name: "Sacrifice & Offerings", blurb: "The offerings, feasts of blood and fire, and rites of atonement that let a holy God and a fragile people share life together. Christians read them as pictures finally gathered up in the self-giving of Jesus (Hebrews 8–10)." },
  { id: "purity", name: "Purity & Impurity", blurb: "Laws about clean and unclean states: skin disease, bodily flows, contact with death. Impurity was usually not sin, but a condition that kept death and disorder away from the sanctuary. Jesus touched what was unclean, and it became clean." },
  { id: "food", name: "Food Laws", blurb: "What Israel could and could not eat, and how to treat blood. These laws marked Israel as a distinct people at every meal. The New Testament declares all foods clean while honouring the love that lay behind the rules (Mark 7:19; Acts 10; Romans 14)." },
  { id: "sabbath-feasts", name: "Sabbath & Feasts", blurb: "The rhythm of holy time: the weekly Sabbath, the seventh year, the Jubilee and the pilgrim festivals. Time itself became a teacher of rest, freedom and joy, and the New Testament sees Christ as the substance these shadows pointed to (Colossians 2:16–17)." },
  { id: "justice", name: "Justice & Mercy", blurb: "Laws for courts, debts, workers, the poor and the stranger. Many were remarkably humane for their world; some reflect the limits of their age. They show God bending an ancient society toward mercy." },
  { id: "worship", name: "Worship & Devotion", blurb: "How Israel was to honour God: no other gods, no images, reverence for the Name, priests, vows, and daily reminders of the covenant worn on the body and written on the doorposts." },
  { id: "family", name: "Family & Marriage", blurb: "Laws about marriage, divorce, inheritance and the protection of family lines in a tribal, patriarchal society. Some protected the vulnerable; others Jesus himself said were concessions to “the hardness of your hearts” (Mark 10:5)." },
  { id: "penal", name: "Penalties & Capital Laws", blurb: "Laws that carried severe punishments, including death. Read honestly, they belong to an ancient legal world, and Jesus' own handling of the Law calls Christians to read them through his mercy (John 8:1–11; Matthew 5:38–48)." },
  { id: "moral", name: "Love & the Moral Core", blurb: "Commands about honesty, faithfulness, life and desire, gathered up in the two great commands to love God and neighbour. Note: dividing the Law into ‘moral, civil and ceremonial’ is a later Christian scheme (Aquinas, Calvin); Jewish tradition counts 613 commandments without that split." },
  { id: "boundaries", name: "Boundaries & Distinctions", blurb: "Laws of separation: no mixed fabrics, no mixed seeds, signs on the body that set Israel apart from the nations. They taught a people to see the world as ordered and themselves as set apart. In Christ the dividing wall between peoples comes down (Ephesians 2:14)." }
];

window.RG.laws = [
  // ---------------- TEN COMMANDMENTS ----------------
  { id: "no-other-gods", name: "Ten Commandments 1: No Other Gods", category: "worship", ref: "Exodus 20:2–3; Deuteronomy 5:6–7",
    text: "“I am Yahweh your God, who brought you out of the land of Egypt, out of the house of bondage. You shall have no other gods before me.”",
    meaning: "The commands open not with a demand but with a rescue: God names himself as the one who freed slaves. In a world of many local and national gods, Israel was to give exclusive loyalty to Yahweh, much like a treaty bound a vassal to one great king. Scholars debate whether this first meant strict monotheism (no other gods exist) or monolatry (worship only one); the later prophets make the stronger claim plain (Isaiah 45:5). Traditions number the Ten differently: Jews count verse 2 as the first ‘word’, while Catholics and Lutherans combine this with the images command.",
    why: "Every other god Israel knew was tied to power, fertility and the state, and often to fear. Loyalty to the God who liberates protected Israel from being drawn back into the logic of Egypt. It shaped their identity around grace received before law given.",
    christ: "Jesus quotes the Shema as the first command (Mark 12:29–30) and reveals the one God as Father, Son and Spirit in a shared life of love (John 17:21). The God who ‘brought you out of bondage’ is seen fully in the one who frees us from sin and death (Luke 4:18; Galatians 5:1).",
    misuse: "The command has sometimes been turned into a license for violence against other faiths, or into a picture of a jealous tyrant, rather than the faithful love of a rescuer who wants his people free." },

  { id: "no-graven-images", name: "Ten Commandments 2: No Graven Images", category: "worship", ref: "Exodus 20:4–6; Deuteronomy 4:15–19",
    text: "“You shall not make for yourselves an idol, nor any image of anything that is in the heavens above, or that is in the earth beneath... you shall not bow yourself down to them, nor serve them.”",
    meaning: "In the Ancient Near East a cult statue was not just art; it was believed to house the god's presence. Mesopotamian texts describe a ‘mouth-washing’ ritual (mīs pî) to bring a statue to life so the god could dwell in it and be fed, clothed and managed. Israel was forbidden to make any image of Yahweh or other gods: God cannot be captured, carried off, or controlled. Deuteronomy 4 grounds it in Sinai: ‘you saw no form.’ The line about visiting iniquity ‘to the third and fourth generation’ is set against love ‘to thousands’, stressing that mercy far outruns judgment.",
    why: "An image gives worshippers a handle on God, a way to manipulate the divine. Forbidding images protected Israel from a religion of control and kept God free and personal. It also fits Genesis 1:26–27: God already has an image on earth, namely human beings.",
    christ: "The New Testament makes a startling claim: God has given his own image. Christ ‘is the image of the invisible God’ (Colossians 1:15) and whoever has seen him has seen the Father (John 14:9). We do not make God's image; God shows his face in Jesus, and that image is cruciform love, not a tool to wield. Every mental picture of God that does not look like Jesus is, in a sense, a graven image.",
    misuse: "Christians fought bitterly over icons: the Second Council of Nicaea (787) distinguished veneration from worship, while some Reformers smashed statues and windows. Both sides at times missed the deeper point: the most dangerous idols are false ideas of God, such as a violent or unloving deity." },

  { id: "name-in-vain", name: "Ten Commandments 3: Not Taking the Name in Vain", category: "worship", ref: "Exodus 20:7",
    text: "“You shall not take the name of Yahweh your God in vain, for Yahweh will not hold him guiltless who takes his name in vain.”",
    meaning: "Literally, ‘you shall not lift up (or carry) the name of Yahweh to emptiness.’ In its setting this most likely concerned false oaths sworn in God's name, using the name in magic or curses, and making empty vows. Some scholars also hear a wider sense: Israel ‘bears’ God's name before the nations and must not do so falsely.",
    why: "Courts and contracts relied on oaths, so false swearing destroyed trust and justice. Protecting God's name protected the truthfulness of the whole community, and guarded God's reputation among the nations.",
    christ: "Jesus goes further: let your yes be yes and your no be no (Matthew 5:33–37), since all speech is before God. He came ‘in his Father's name’ (John 5:43) and revealed that Name truly (John 17:6). Christians now carry his name, and the worst misuse is to attach it to cruelty.",
    misuse: "The command is often reduced to a ban on swearing words, while the far graver misuse, invoking God's name to bless war, abuse or greed, goes unchallenged." },

  { id: "sabbath-commandment", name: "Ten Commandments 4: Remember the Sabbath", category: "sabbath-feasts", ref: "Exodus 20:8–11; Deuteronomy 5:12–15",
    text: "“Remember the Sabbath day, to keep it holy. You shall labour six days, and do all your work, but the seventh day is a Sabbath to Yahweh your God. You shall not do any work in it, you, nor your son, nor your daughter, your male servant, nor your female servant...”",
    meaning: "The Sabbath was one of Israel's most distinctive practices: a seventh-day rest that included servants, foreigners and even animals. Exodus grounds it in creation (God rested on the seventh day), while Deuteronomy grounds it in liberation: ‘remember that you were a servant in Egypt.’ Babylonian texts mention a day called šapattu (the full-moon day), but a regular weekly rest for everyone has no clear parallel; the exact origins are debated. In a slave economy where Pharaoh demanded endless bricks, a weekly day off was a revolution.",
    why: "It protected the weak from exhaustion and exploitation, since even the slave and the ox rested. It trained Israel to trust that life is a gift, not something produced by endless work. And it marked time itself as holy, a weekly sign of the covenant (Exodus 31:13).",
    christ: "Jesus called himself ‘Lord of the Sabbath’ and said ‘the Sabbath was made for man, not man for the Sabbath’ (Mark 2:27–28); he healed on it deliberately to show its true purpose. Paul calls Sabbaths ‘a shadow of the things to come; but the body is Christ's’ (Colossians 2:16–17), and Hebrews 4:9–10 speaks of a rest that remains for God's people. In the relational reading, Jesus himself is our Sabbath: we rest in his finished work and share his rest with the weary (Matthew 11:28).",
    misuse: "Christians have kept it in very different ways: some (e.g. Seventh-day Adventists) hold to Saturday, many Protestants (e.g. the Westminster tradition) treat Sunday as the ‘Christian Sabbath’, and others see it fulfilled in Christ; this remains debated. Its misuse has come through harsh legalism, such as Puritan-era penalties and blue laws, which turned a gift of rest into a burden, the very thing Jesus challenged." },

  { id: "honour-parents", name: "Ten Commandments 5: Honour Father and Mother", category: "moral", ref: "Exodus 20:12; Deuteronomy 5:16",
    text: "“Honour your father and your mother, that your days may be long in the land which Yahweh your God gives you.”",
    meaning: "The Hebrew word for honour (kabed) comes from ‘heavy’: give your parents weight. In an agrarian world with no pensions, this was addressed mainly to adult children and meant caring for elderly parents, providing for them, and not shaming or abandoning them. Both mother and father are named, which was notable.",
    why: "Family was the social safety net; neglecting the old meant destitution for them. The command held the generations together and passed faith and memory down the line, which is why it is tied to long life in the land.",
    christ: "Jesus defended this command against a religious loophole (Corban) that let people dodge supporting their parents (Mark 7:9–13), and from the cross he provided for his mother (John 19:26–27). Paul calls it ‘the first commandment with a promise’ and also tells fathers not to provoke their children (Ephesians 6:1–4).",
    misuse: "It has been used to demand that children obey or stay silent about abusive parents. Honouring does not mean submitting to harm, and Jesus also said discipleship can put us at odds with family (Matthew 10:35–37)." },

  { id: "no-murder", name: "Ten Commandments 6: You Shall Not Murder", category: "moral", ref: "Exodus 20:13",
    text: "“You shall not murder.”",
    meaning: "The verb ratsach usually refers to unlawful killing of a person, often personal or blood-feud killing, rather than every kind of killing; the same Law also permits war and capital punishment. Its exact range is debated (it is also used of accidental manslaughter in Numbers 35). The deeper basis is Genesis 9:6: humans bear God's image.",
    why: "In a society without police, blood feuds could destroy whole clans. This command placed human life under God's protection and moved killing out of private vengeance and into limits and courts.",
    christ: "Jesus traced murder back to contempt and anger in the heart (Matthew 5:21–24) and called his followers to love enemies (Matthew 5:44). At the cross, humanity committed its worst killing and God answered with forgiveness (Luke 23:34). Relational-gospel writers (e.g. Brian Zahnd, Greg Boyd) see here a call to non-violence; many traditional Christians hold that just war and capital punishment remain permitted. That debate is real.",
    misuse: "Christians have often narrowed it to private murder while blessing crusades, inquisitions and wars of conquest, and sometimes drawn the circle of protected life very selectively." },

  { id: "no-adultery", name: "Ten Commandments 7: You Shall Not Commit Adultery", category: "moral", ref: "Exodus 20:14",
    text: "“You shall not commit adultery.”",
    meaning: "In the Ancient Near East adultery was defined mainly by the woman's marital status: sex between a married or betrothed woman and a man not her husband. A married man with an unmarried woman was treated differently, which reflects a patriarchal world where paternity and inheritance were at stake. Many law codes (e.g. Hammurabi) also punished it severely.",
    why: "It guarded the trust at the centre of family life, the security of children and the stability of inheritance. Covenant faithfulness in marriage also became Israel's chief image of God's own faithfulness (Hosea 2).",
    christ: "Jesus extended the command to the heart (Matthew 5:27–28) and applied it equally to men, removing the old double standard (Mark 10:11–12). When a woman caught in adultery was brought to him, he refused condemnation and said ‘go, and sin no more’ (John 8:1–11; note this passage is missing from the earliest manuscripts, though many think it a genuine memory of Jesus). Paul sees marriage as a picture of Christ's self-giving love (Ephesians 5:25–32).",
    misuse: "The church has often punished women far more harshly than men, and has sometimes treated sexual sin as the only sin, rather than one sign of a deeper loss of faithful love." },

  { id: "no-stealing", name: "Ten Commandments 8: You Shall Not Steal", category: "moral", ref: "Exodus 20:15",
    text: "“You shall not steal.”",
    meaning: "Theft of property was handled elsewhere with restitution, often double or more (Exodus 22:1–4), not prison. Some rabbinic interpreters (Talmud, Sanhedrin 86a) read the Decalogue's ‘steal’ as kidnapping, i.e. stealing a person, since Exodus 21:16 makes that a capital crime; this reading is debated.",
    why: "In a subsistence economy, losing an animal or tool could ruin a family. The command protected the means of life, and the restitution system aimed at repair rather than revenge.",
    christ: "Paul turns it into generosity: ‘let him who stole steal no more; but rather let him labour... that he may have something to give’ (Ephesians 4:28). Zacchaeus, met by Jesus, restores fourfold (Luke 19:8). In Christ the goal is not just ‘don't take’ but ‘share’ (Acts 2:44–45).",
    misuse: "It has sometimes been used to defend unjust wealth while ignoring the prophets' charge that exploiting the poor is itself theft (Isaiah 3:14–15; James 5:4)." },

  { id: "no-false-witness", name: "Ten Commandments 9: No False Witness", category: "moral", ref: "Exodus 20:16; Deuteronomy 19:15–21",
    text: "“You shall not give false testimony against your neighbour.”",
    meaning: "This was first a courtroom command. Cases were heard by elders at the city gate, often with no other evidence than testimony. The Law required at least two witnesses for a conviction, and a lying witness was to receive the penalty he tried to bring on his neighbour (Deuteronomy 19:19).",
    why: "When testimony is everything, one liar can destroy an innocent life. The command protected the weak from being framed by the powerful, as Naboth was (1 Kings 21).",
    christ: "Jesus himself was condemned by false witnesses (Mark 14:55–59), entering the place of every falsely accused person. He is ‘the faithful witness’ (Revelation 1:5) and calls the Spirit the Spirit of truth (John 16:13). Paul applies it broadly: ‘putting away falsehood, speak truth each one with his neighbour’ (Ephesians 4:25).",
    misuse: "Religious authorities have at times bent truth to protect institutions, including covering up abuse, which breaks this command in the very place it should be honoured most." },

  { id: "no-coveting", name: "Ten Commandments 10: You Shall Not Covet", category: "moral", ref: "Exodus 20:17; Deuteronomy 5:21",
    text: "“You shall not covet your neighbour's house... nor his male servant, nor his female servant, nor his ox, nor his donkey, nor anything that is your neighbour's.”",
